<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองที่นั่ง ห้อง 3/2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--wall:#f3e6a8;--wall2:#fbf6dc;--board:#2e5242;--frame:#8a5a3b;--wood:#a8744c;--wood2:#7c4f31;--chalk:#f4f1e6;--ink:#2b2118;--acc:#e0a526;--bad:#b4442f;--ok:#2f7a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#4a4325;--wall2:#2a2619;--ink:#f1ead7;--board:#1f3a2e;--frame:#6b4429}}
:root[data-theme="dark"]{--wall:#4a4325;--wall2:#2a2619;--ink:#f1ead7;--board:#1f3a2e;--frame:#6b4429}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
background:linear-gradient(var(--wall2) 0 140px,var(--wall) 140px 190px,transparent 190px),
repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 70px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 70px),#e9e6e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(var(--wall2) 0 140px,var(--wall) 140px 190px,transparent 190px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 70px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 70px),#25282a}}
main{max-width:620px;margin:0 auto;padding:16px}
.boardwrap{background:var(--board);border:10px solid var(--frame);border-radius:10px;padding:16px;color:var(--chalk);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.boardwrap h1{margin:0;font-size:26px;letter-spacing:.5px}
.boardwrap .s{opacity:.85;font-size:14px}
.tray{height:8px;background:var(--frame);border-radius:0 0 6px 6px;width:70%;margin:0 auto 14px}
.panel{background:var(--wall2);border:2px solid var(--frame);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
label{display:block;font-size:14px;font-weight:600;margin:8px 0 4px}
input,select,button{font:inherit;font-size:16px}
input,select{width:100%;padding:11px;border:2px solid var(--frame);border-radius:10px;background:#fff;color:#2b2118}
button.big{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#2b2118;font-weight:700;box-shadow:0 4px 0 #a97a14;cursor:pointer}
button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a97a14}
button.sm{padding:9px 14px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:600;cursor:pointer}
button.danger{background:var(--bad)}
.hide{display:none!important}
.cd{display:flex;gap:8px;justify-content:center;margin:10px 0}
.cd div{background:var(--board);color:var(--chalk);border:3px solid var(--frame);border-radius:10px;min-width:62px;padding:8px 4px;text-align:center}
.cd b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd small{font-size:11px;opacity:.8}
.status{text-align:center;font-weight:700;font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#999}
.dot.on{background:#2fb36a;box-shadow:0 0 0 4px rgba(47,179,106,.25)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.hello a{color:inherit;text-decoration:underline;cursor:pointer;font-size:13px}
.front{text-align:center;font-size:12px;opacity:.7;margin:2px 0 10px}
.wrap{overflow-x:auto;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px;min-width:330px}
.seat{position:relative;aspect-ratio:1/1.05;border:0;border-radius:6px 6px 10px 10px;background:linear-gradient(var(--wood) 0 62%,var(--wood2) 62%);color:#fff;padding:0;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.seat::before{content:"";position:absolute;top:5px;left:12%;right:12%;height:34%;background:#f7f5ee;border-radius:3px 3px 6px 6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.seat b{position:relative;font-size:15px;color:#4a3320;margin-bottom:auto;margin-top:9px}
.seat span{position:relative;font-size:10px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:3px}
.seat:not(.taken):not(.mine):hover{filter:brightness(1.12)}
.seat.taken{background:linear-gradient(#9b9b9b 0 62%,#6e6e6e 62%);cursor:not-allowed}
.seat.taken::before{background:#d8d6cf}
.seat.mine{background:linear-gradient(#f2b84b 0 62%,#c58f25 62%);color:#2b2118;outline:3px solid #fff}
.legend{display:flex;gap:14px;font-size:12px;margin-top:12px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-3px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b2118;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;z-index:5}
#toast.show{opacity:1}
a.lnk{font-size:13px;text-decoration:underline;cursor:pointer;opacity:.75}
</style>
</head>
<body>
<main>
  <div class="boardwrap"><h1>✏️ จองที่นั่ง ห้อง 3/2</h1><div class="s">โต๊ะเรียน 42 ที่นั่ง (6 แถว × 7 โต๊ะ) · จองได้คนละ 1 ที่</div></div>
  <div class="tray"></div>

  <!-- หน้า 1: กรอกชื่อเล่น + เลขที่ -->
  <section id="gate" class="panel">
    <b>ลงชื่อเข้าห้องเรียน</b>
    <label for="nick">ชื่อเล่น</label><input id="nick" maxlength="20" placeholder="เช่น น้องมะนาว" autocomplete="nickname">
    <label for="num">เลขที่</label><input id="num" maxlength="3" inputmode="numeric" placeholder="เช่น 12">
    <button class="big" id="enter">เข้าสู่หน้าจองที่นั่ง</button>
  </section>

  <!-- หน้า 2: จองที่นั่ง -->
  <section id="book" class="hide">
    <div class="panel">
      <div class="hello"><span id="hi"></span><a id="logout">เปลี่ยนชื่อ</a></div>
      <div class="status"><span class="dot" id="dot"></span><span id="stat">กำลังโหลด…</span></div>
      <div id="cdBox" class="hide">
        <div class="cd"><div><b id="cD">00</b><small>วัน</small></div><div><b id="cH">00</b><small>ชั่วโมง</small></div><div><b id="cM">00</b><small>นาที</small></div><div><b id="cS">00</b><small>วินาที</small></div></div>
        <div class="status" style="font-weight:400;font-size:13px" id="openAtTxt"></div>
      </div>
    </div>
    <div class="panel">
      <div class="front">▲ หน้าห้อง (กระดาน) ▲</div>
      <div class="wrap"><div class="grid" id="grid"></div></div>
      <div class="legend"><span><i style="background:#a8744c"></i>ว่าง</span><span><i style="background:#8a8a8a"></i>จองแล้ว</span><span><i style="background:#f2b84b"></i>ที่ของฉัน</span><span id="count"></span></div>
      <div class="status" style="font-weight:400;font-size:13px;margin-top:8px" id="mine"></div>
      <div id="roster" style="margin-top:10px;font-size:13px"></div>
    </div>
  </section>

  <div class="panel hide" id="adminCard">
    <b>ผู้ดูแล: ตั้งเวลาเปิดระบบ</b>
    <div class="row"><div><label>เปิดจอง</label><input type="datetime-local" id="opensAt"></div><div><label>ปิดจอง (ไม่บังคับ)</label><input type="datetime-local" id="closesAt"></div></div>
    <label>โหมด</label><select id="mode"><option value="auto">ตามเวลาที่ตั้ง</option><option value="open">เปิดทันที</option><option value="closed">ปิดทันที</option></select>
    <div class="row" style="margin-top:12px"><button class="sm" id="save">บันทึก</button><button class="sm danger" id="reset">ล้างที่นั่งทั้งหมด</button><button class="sm" id="exitAdmin" style="background:#6b5a4a">ออกจากโหมดผู้ดูแล</button></div>
    <div class="status" style="font-weight:400;font-size:12px;margin-top:8px">แตะที่นั่งที่มีคนจองเพื่อยกเลิกให้ได้</div>
  </div>
  <div style="text-align:center;margin:18px 0"><a class="lnk" id="adminLink">โหมดผู้ดูแล</a></div>
</main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== วางค่า firebaseConfig ของคุณตรงนี้ =====
const firebaseConfig = {
  apiKey: "AIzaSyAxzPpYUT4_NphBgXjndpbt0zUW0xbITFE",
  authDomain: "seat-room32.firebaseapp.com",
  projectId: "seat-room32",
  appId: "1:510960769345:web:8cee213b308b24ce9ee9c0"
};
// ==============================================
const ROWS=6,COLS=7,TOTAL=ROWS*COLS,ADMIN_PW="252711";
const $=id=>document.getElementById(id);
let fs=null,admin=false,busy=false,me=null;
let seats={},cfg={mode:"auto",opensAt:null,closesAt:null};
let uid=null;
try{uid=localStorage.getItem("r32uid");if(!uid){uid="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("r32uid",uid)}}catch(e){uid="u"+Math.random().toString(36).slice(2)}
const seatRef=n=>fs.collection("seats").doc(String(n));
const cfgRef=()=>fs.collection("settings").doc("config");

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
function fmt(ms){return new Date(ms).toLocaleString("th-TH",{dateStyle:"long",timeStyle:"short"})}
function toLocalInput(ms){return ms?new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16):""}
function isOpen(){
  if(cfg.mode==="open")return true;
  if(cfg.mode==="closed")return false;
  const n=Date.now();
  return !!cfg.opensAt&&n>=cfg.opensAt&&(!cfg.closesAt||n<cfg.closesAt);
}
function mySeat(){for(const k in seats){if(seats[k].owner===uid)return +k}return null}
const p2=n=>String(n).padStart(2,"0");

function tick(){
  const open=isOpen();
  const counting=cfg.mode==="auto"&&cfg.opensAt&&Date.now()<cfg.opensAt;
  $("cdBox").classList.toggle("hide",!counting);
  if(counting){
    let s=Math.max(0,Math.floor((cfg.opensAt-Date.now())/1000));
    $("cD").textContent=p2(Math.floor(s/86400));$("cH").textContent=p2(Math.floor(s%86400/3600));
    $("cM").textContent=p2(Math.floor(s%3600/60));$("cS").textContent=p2(s%60);
    $("openAtTxt").textContent="เปิดจอง "+fmt(cfg.opensAt);
  }
  $("dot").className="dot"+(open?" on":"");
  $("stat").textContent=open?"เปิดให้จองแล้ว! เลือกที่นั่งได้เลย":counting?"รอเปิดระบบ":(cfg.mode==="auto"&&!cfg.opensAt?"ยังไม่ได้ตั้งเวลาเปิด":"ปิดการจองอยู่");
}
function render(){
  tick();
  const g=$("grid");g.textContent="";let taken=0;
  for(let i=1;i<=TOTAL;i++){
    const s=seats[i],el=document.createElement("button");
    el.className="seat"+(s?(s.owner===uid?" mine":" taken"):"");
    const nb=document.createElement("b");nb.textContent=i;el.appendChild(nb);
    if(s){taken++;const sp=document.createElement("span");sp.textContent=s.name||"";el.appendChild(sp)}
    el.onclick=()=>onSeat(i);g.appendChild(el);
  }
  $("count").textContent="ว่าง "+(TOTAL-taken)+"/"+TOTAL;
  const ro=$("roster");ro.textContent="";
  const ks=Object.keys(seats).map(Number).sort((a,b)=>a-b);
  if(ks.length){const h=document.createElement("b");h.textContent="รายชื่อผู้จอง";ro.appendChild(h);
    ks.forEach(k=>{const d=document.createElement("div");d.textContent="ที่นั่ง "+k+" — "+(seats[k].name||"-");ro.appendChild(d)})}
  const m=mySeat();
  $("mine").textContent=m?"ที่นั่งของคุณ: หมายเลข "+m+" (แตะที่นั่งนั้นเพื่อยกเลิก หรือแตะที่ว่างเพื่อย้าย)":"";
}

async function onSeat(n){
  if(!fs||!me){toast("ยังเชื่อมต่อระบบไม่ได้");return}
  const s=seats[n];
  if(s){
    if(s.owner===uid||admin){
      if(busy)return;busy=true;
      try{await seatRef(n).delete();toast("ยกเลิกที่นั่ง "+n+" แล้ว")}catch(e){toast("ทำรายการไม่สำเร็จ ลองใหม่")}
      busy=false;
    }else toast("ที่นั่ง "+n+" จองโดย "+(s.name||"-"));
    return;
  }
  if(!isOpen()){toast("ยังไม่เปิดให้จอง");return}
  if(busy)return;busy=true;
  try{
    const old=mySeat();
    await fs.runTransaction(async t=>{
      const snap=await t.get(seatRef(n));
      if(snap.exists)throw new Error("TAKEN");
      t.set(seatRef(n),{owner:uid,name:me.nick+" ("+me.num+")",nick:me.nick,num:me.num,at:Date.now()});
    });
    if(old&&old!==n){try{await seatRef(old).delete()}catch(e){}}
    toast("จองที่นั่ง "+n+" สำเร็จ 🎉");
  }catch(e){
    toast(e&&e.message==="TAKEN"?"ที่นั่งนี้ถูกจองไปแล้ว":"จองไม่สำเร็จ ("+((e&&(e.code||e.message))||"error")+")");
  }
  busy=false;
}

function showBook(){
  $("gate").classList.add("hide");$("book").classList.remove("hide");
  $("hi").textContent="สวัสดี "+me.nick+" · เลขที่ "+me.num;render();
}
$("enter").onclick=()=>{
  const nick=$("nick").value.trim(),num=$("num").value.trim();
  if(!nick){toast("กรุณากรอกชื่อเล่น");$("nick").focus();return}
  if(!/^\d{1,3}$/.test(num)){toast("กรุณากรอกเลขที่เป็นตัวเลข");$("num").focus();return}
  me={nick,num:String(+num)};
  try{localStorage.setItem("r32me",JSON.stringify(me))}catch(e){}
  showBook();
};
$("logout").onclick=()=>{me=null;try{localStorage.removeItem("r32me")}catch(e){}$("book").classList.add("hide");$("gate").classList.remove("hide")};

function fillAdmin(){$("opensAt").value=toLocalInput(cfg.opensAt);$("closesAt").value=toLocalInput(cfg.closesAt);$("mode").value=cfg.mode||"auto"}
$("adminLink").onclick=()=>{
  if(admin)return;
  const p=prompt("กรอกรหัสผ่านผู้ดูแล");
  if(p===null)return;
  if(p!==ADMIN_PW){toast("รหัสผ่านไม่ถูกต้อง");return}
  admin=true;$("adminCard").classList.remove("hide");$("adminLink").classList.add("hide");fillAdmin();
  if(!me){$("book").classList.remove("hide");$("gate").classList.add("hide");render()}
  toast("เข้าสู่โหมดผู้ดูแลแล้ว");
};
$("exitAdmin").onclick=()=>{admin=false;$("adminCard").classList.add("hide");$("adminLink").classList.remove("hide");if(!me){$("book").classList.add("hide");$("gate").classList.remove("hide")}toast("ออกจากโหมดผู้ดูแลแล้ว")};
$("save").onclick=async()=>{
  if(!admin||!fs)return;
  const o=$("opensAt").value,c=$("closesAt").value;
  const data={mode:$("mode").value,opensAt:o?new Date(o).getTime():null,closesAt:c?new Date(c).getTime():null};
  if(data.opensAt&&data.closesAt&&data.closesAt<=data.opensAt){toast("เวลาปิดต้องหลังเวลาเปิด");return}
  try{await cfgRef().set(data);toast("บันทึกแล้ว")}catch(e){toast("บันทึกไม่สำเร็จ ("+((e&&e.code)||"error")+")")}
};
$("reset").onclick=async()=>{
  if(!admin||!fs||!confirm("ล้างการจองทั้งหมด?"))return;
  for(const k of Object.keys(seats)){try{await seatRef(k).delete()}catch(e){}}
  toast("ล้างที่นั่งแล้ว");
};

(function init(){
  try{const m=JSON.parse(localStorage.getItem("r32me")||"null");if(m&&m.nick&&m.num){me=m;$("nick").value=m.nick;$("num").value=m.num}}catch(e){}
  if(me)showBook();
  setInterval(tick,1000);
  if(firebaseConfig.apiKey==="YOUR_API_KEY"){$("stat").textContent="ยังไม่ได้ใส่ค่า firebaseConfig ในไฟล์";return}
  try{firebase.initializeApp(firebaseConfig);fs=firebase.firestore()}catch(e){$("stat").textContent="เชื่อมต่อไม่ได้";return}
  fs.collection("seats").onSnapshot(snap=>{
    const m={};snap.forEach(d=>{const v=d.data();if(v&&v.owner)m[d.id]=v});
    seats=m;render();
  },e=>toast("การเชื่อมต่อขัดข้อง ("+((e&&e.code)||"error")+")"));
  cfgRef().onSnapshot(d=>{
    if(d.exists)cfg=Object.assign({mode:"auto",opensAt:null,closesAt:null},d.data());
    if(admin&&document.activeElement.tagName!=="INPUT")fillAdmin();
    render();
  },e=>{});
})();
</script>
</body>
</html>
